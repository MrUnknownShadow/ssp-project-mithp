- name: Docker Storage Driver
  requirements:
  - Do not use aufs as the storage driver for your Docker instance.
  section: '2.6'
- name: Storage Driver Support
  requirements:
  - The aufs storage driver is the oldest storage driver used on Linux systems. It
    is based on a Linux kernel patch-set that is unlikely in future to be merged into
    the main OS kernel. The aufs driver is also known to cause some serious kernel
    crashes. aufs only has legacy support within systems using Docker.
  section: '2.6'
- name: Storage Driver Usage
  requirements:
  - "It might be useful if you are running thousands of containers with the same program\
    \ or libraries, however its use should be reviewed in line with your organization\u2019\
    s security policy."
  section: '2.6'
- name: Audit Command
  requirements:
  - 'Execute the below command and verify that aufs is not used as storage driver:
    docker info --format ''Storage Driver: {{ .Driver }}'''
  section: '2.6'
- name: Default Storage Driver
  requirements:
  - By default, Docker uses overlay2 as the storage driver on most of the platforms.
    The default storage driver can vary based on your OS vendor. You should use the
    storage driver that is recommended by your preferred vendor and which is in line
    with policy around the applications which are being deployed.
  section: '2.6'
